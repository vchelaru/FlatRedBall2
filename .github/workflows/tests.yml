name: All Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Dispatched by "Regenerate golden images" after it pushes: a push made with GITHUB_TOKEN does
  # not trigger pull_request/push runs, so without this the PR would keep the stale red check.
  workflow_dispatch:

jobs:
  engine-tests:
    name: Engine and AnimationEditor tests (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # --verbosity minimal drops the MSBuild compile/copy spam; the console logger
      # at verbosity=minimal prints only failed tests + the final summary (no per-test
      # "Passed" lines), so a failure is not buried under hundreds of passes.
      # --blame-crash records which test was running when the test host died, so a host crash
      # (seen once on Linux CI after 360 tests, never locally) names its culprit instead of just
      # "Test host process crashed". The next step prints that record when the run fails.
      - name: Test engine
        run: dotnet test tests/FlatRedBall2.Tests/FlatRedBall2.Tests.csproj --verbosity minimal --logger "console;verbosity=minimal" --blame-crash --results-directory "$RUNNER_TEMP/engine-test-results"

      - name: Show engine test crash record
        if: failure()
        run: find "$RUNNER_TEMP/engine-test-results" -name "Sequence_*.xml" -exec sh -c 'echo "== $1"; tail -n 20 "$1"' _ {} \;

      # The record above printed nothing on a PR run (#1296) that still produced a crash dump, so
      # list what --blame-crash wrote and keep the dump itself for offline inspection.
      - name: List engine test crash files
        if: failure()
        run: find "$RUNNER_TEMP/engine-test-results" -type f -exec ls -l {} \;

      - name: Upload engine test crash files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: engine-test-crash
          path: ${{ runner.temp }}/engine-test-results
          if-no-files-found: ignore
          retention-days: 3

      - name: Test AnimationChain.Common
        run: dotnet test tests/AnimationChain.Common.Tests/AnimationChain.Common.Tests.csproj --verbosity minimal --logger "console;verbosity=minimal"

      # Issue #683: published NuGet packages are packed with `dotnet pack -c Release`, so a
      # build-time `#if DEBUG` around AutomationMode would strip the real implementation out of
      # every shipped assembly. The fix keeps the implementation compiled in under both
      # configurations and gates the public entry point with [Conditional("DEBUG")] instead,
      # evaluated against the *consumer's* DEBUG symbol. This step builds the real engine
      # assembly in Release and greps its bytes for the internal StartAutomationMode symbol.
      #
      # This used to be an xUnit test (#708) that shelled out to `dotnet build` from inside the
      # test process into a fresh temp dir every run — no incremental-build cache reuse, so it
      # cost a full cold Release build (~15 minutes) on every `dotnet test` invocation, dwarfing
      # the rest of the ~1170-test suite (which runs in a few seconds combined). Doing the same
      # check as a plain CI step instead avoids paying that cost inside "unit test" overhead.
      - name: Release build contains AutomationMode implementation
        run: |
          dotnet build src/FlatRedBall2.csproj -c Release -f net10.0 -o /tmp/frb2-release-check --verbosity minimal
          grep -qa StartAutomationMode /tmp/frb2-release-check/FlatRedBall2.dll

      - name: Build dotnet new templates
        run: |
          dotnet build templates/frb2-desktop/MyGame.slnx --verbosity minimal
          dotnet build templates/frb2-multiplatform/MyGame.slnx --verbosity minimal

      # Issue #970: this sample references AnimationChain.MonoGame/.Common directly and had
      # drifted out of sync with their API with nothing catching it, since no CI step built it.
      - name: Build AnimationChainSample
        run: dotnet build samples/AnimationChainSample/AnimationChainSample.csproj --verbosity minimal

      - name: Test AnimationEditor.Core
        run: dotnet test tools/AnimationEditorAvalonia/tests/AnimationEditor.Core.Tests/AnimationEditor.Core.Tests.csproj --verbosity minimal --logger "console;verbosity=minimal"

      # AnimationEditor.App.Tests references Avalonia.Headless.XUnit, which provides a
      # headless platform — no display server needed.
      - name: Test AnimationEditor.App
        run: dotnet test tools/AnimationEditorAvalonia/tests/AnimationEditor.App.Tests/AnimationEditor.App.Tests.csproj --verbosity minimal --logger "console;verbosity=minimal"

      - name: Test AnimationEditor.Views
        run: dotnet test tools/AnimationEditorAvalonia/tests/AnimationEditor.Views.Tests/AnimationEditor.Views.Tests.csproj --verbosity minimal --logger "console;verbosity=minimal"

      # Separate assembly from AnimationEditor.App.Tests so it can run headless with real
      # (non-no-op) Skia drawing — see AnimationEditor.DocScreenshots/TestAppBuilder.cs.
      - name: Test AnimationEditor.DocScreenshots
        run: dotnet test tools/AnimationEditorAvalonia/tests/AnimationEditor.DocScreenshots/AnimationEditor.DocScreenshots.csproj --verbosity minimal --logger "console;verbosity=minimal"

  # Renders scenes offscreen on Mesa llvmpipe (software OpenGL under xvfb) and compares them to the
  # checked-in PNGs in tests/FlatRedBall2.GoldenImage.Tests/Golden (#1420). Its own job because
  # Linux GL has had intermittent native test-host crashes (#1300): a crash here fails only this
  # job, never the ~1800 headless tests in engine-tests. It still gates the "dotnet test" check
  # below, so a red golden job blocks merge like any other test failure.
  golden-image-tests:
    name: Golden image tests (ubuntu, llvmpipe)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
      FRB_GOLDEN_IMAGES: "1"
      FRB_GOLDEN_ARTIFACTS: ${{ github.workspace }}/golden-artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install Mesa software GL and xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1 libglx-mesa0 libgl1-mesa-dri libegl1 mesa-utils

      # Goldens are only valid if llvmpipe really rendered them; fail loudly here, not as a pixel diff.
      - name: Show GL renderer
        run: xvfb-run -a glxinfo -B | grep -E "OpenGL (renderer|version) string"

      # FRB_GOLDEN_IMAGES=1 makes a missing GL device a failure instead of a skip, so a broken
      # xvfb/Mesa setup cannot turn this job into a green no-op.
      - name: Test golden images
        run: xvfb-run -a -s "-screen 0 1280x720x24" dotnet test tests/FlatRedBall2.GoldenImage.Tests/FlatRedBall2.GoldenImage.Tests.csproj --verbosity minimal --logger "console;verbosity=minimal" --blame-crash --results-directory "$RUNNER_TEMP/golden-test-results"

      - name: Upload golden image failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-image-failures
          path: ${{ github.workspace }}/golden-artifacts
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload golden test crash files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-image-test-crash
          path: ${{ runner.temp }}/golden-test-results
          if-no-files-found: ignore
          retention-days: 3

  animationchain-pack:
    name: Pack AnimationChain NuGet (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Package outputs land in out/animationchain and are uploaded as workflow artifacts.
      - name: Pack AnimationChain package
        run: >
          dotnet pack src/AnimationChain.MonoGame/AnimationChain.MonoGame.csproj
          -c Release
          -o out/animationchain

      - name: Upload AnimationChain package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: animationchain-nuget-packages
          path: out/animationchain/*.nupkg
          if-no-files-found: error
          retention-days: 7

  animationchain-common-pack:
    name: Pack AnimationChain.Common NuGet (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Package outputs land in out/animationchain-common and are uploaded as workflow artifacts.
      - name: Pack AnimationChain.Common package
        run: >
          dotnet pack src/AnimationChain.Common/AnimationChain.Common.csproj
          -c Release
          -o out/animationchain-common

      - name: Upload AnimationChain.Common package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: animationchain-common-nuget-packages
          path: out/animationchain-common/*.nupkg
          if-no-files-found: error
          retention-days: 7

  # Build-only (no tests): the engine job above compiles the MonoGame engine, never the KNI one,
  # so a KNI-incompatible API (e.g. the GameTime.ElapsedGameTime setter, #1415) broke
  # FlatRedBall2.Kni and every BlazorGL head on main with no check failing (#1441). ShmupSpace's
  # head builds FlatRedBall2.BlazorGL, FlatRedBall2.Kni, and the sample's KNI Common project.
  kni-blazorgl-build:
    name: Build KNI and BlazorGL head (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build FlatRedBall2.Kni
        run: dotnet build src/Kni/FlatRedBall2.Kni.csproj --verbosity minimal

      - name: Build ShmupSpace BlazorGL head
        run: dotnet build samples/ShmupSpace/ShmupSpace.BlazorGL/ShmupSpace.BlazorGL.csproj --verbosity minimal

  # Umbrella check that branch protection gates on. Stays named "dotnet test" so the
  # existing required-status-check entry in the main-protection ruleset keeps matching.
  # always() + an explicit result check: with the default success() condition a failed need leaves
  # this job *skipped*, and branch protection treats a skipped required check as passing.
  test:
    name: dotnet test
    runs-on: ubuntu-latest
    needs: [engine-tests, golden-image-tests, kni-blazorgl-build, animationchain-pack, animationchain-common-pack]
    if: ${{ always() }}
    steps:
      - name: All test and packaging jobs passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
